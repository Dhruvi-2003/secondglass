services:
  app:
    build: .
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/secondglass
      DATABASE_USER: secondglass
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your shell or .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      LIVE_DATA_PATH: /app/catalogue/live.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
    volumes:
      - ./catalogue:/app/catalogue:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secondglass
      POSTGRES_USER: secondglass
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondglass -d secondglass"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  catalog-db:

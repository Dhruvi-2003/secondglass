name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 17 minutes past each UTC hour = 47 minutes past each hour in India.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh retailer pages before publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || inputs.refresh == true
        with:
          python-version: '3.12'
      - name: Test collector
        if: github.event_name == 'schedule' || inputs.refresh == true
        run: |
          python -m pip install -r tools/requirements.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Refresh retailer catalogue
        if: github.event_name == 'schedule' || inputs.refresh == true
        timeout-minutes: 12
        run: python tools/refresh_sources.py --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
      - name: Save validated catalogue
        if: github.event_name == 'schedule' || inputs.refresh == true
        run: |
          git add catalogue/live.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh retailer catalogue'
            # No force-push: a concurrent user commit must never be overwritten.
            git push origin HEAD:main
          fi
      # Bot commits do not trigger push workflows; publish in this same run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

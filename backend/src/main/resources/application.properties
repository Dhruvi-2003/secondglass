spring.application.name=secondglass
server.port=${PORT:8086}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/secondglass-${DEMO_MODE:false};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
app.demo=${DEMO_MODE:false}
app.admin-token=${ADMIN_TOKEN:}
app.fresh-hours=${FRESH_HOURS:24}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.daily-limit=${AI_DAILY_LIMIT:20}

app.live-data=${LIVE_DATA_PATH:../catalogue/live.json}
